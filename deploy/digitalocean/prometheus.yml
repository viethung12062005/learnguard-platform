# LearnGuard — Internal Prometheus Configuration (lg_backend_net)
# Scrapes container and host metrics on the DigitalOcean Droplet VM.
# Note: `api:8000` is monitored via Docker healthcheck and `scripts/cd/smoke-test.sh`
# because `/health` returns JSON rather than Prometheus exposition metrics.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: learnguard
    environment: production

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
