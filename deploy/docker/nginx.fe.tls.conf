# LearnGuard Production Nginx Configuration (TLS/HTTPS) — Frontend SPA & API Reverse Proxy
# Mounted at /etc/nginx/conf.d/default.conf when deploy/digitalocean/docker-compose.tls.conf is enabled.

# Rate-limiting zone for API requests (20 requests/sec per client IP, 10MB shared memory)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream learnguard_api {
    server api:8000;
    keepalive 32;
}

# Port 80: Keep /healthz & ACME HTTP-01 challenges direct; redirect all other traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    server_tokens off;

    # Container and Load Balancer Liveness Probe (NEVER redirects so Docker HEALTHCHECK & localhost probes succeed)
    location = /healthz {
        access_log off;
        auth_basic off;
        default_type text/plain;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 200 "ok\n";
    }

    # Let's Encrypt Certbot ACME HTTP-01 challenge webroot
    location /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: Hardened HTTPS Frontend SPA & FastAPI Reverse Proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    # TLS Certificates (compatible with Cloudflare Origin CA cert & Let's Encrypt symlinks)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS Protocol & Cipher Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Optional Pre-Auth Basic Auth Hook (before BE-08/BE-09 JWT auth ships):
    # Create /opt/learnguard/deploy/docker/preauth.inc with:
    #   satisfy any;
    #   allow 127.0.0.1;
    #   allow ::1;
    #   deny all;
    #   auth_basic "LearnGuard Pre-Auth";
    #   auth_basic_user_file /etc/nginx/conf.d/.htpasswd;
    # Mount preauth.inc and .htpasswd into /etc/nginx/conf.d/ and uncomment below:
    # include /etc/nginx/conf.d/preauth.inc;

    # Gzip compression for static assets & JSON responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Hardened HTTP Security Headers (including strict HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # Container and Load Balancer Liveness Probe over HTTPS
    location = /healthz {
        access_log off;
        auth_basic off;
        default_type text/plain;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        return 200 "ok\n";
    }

    # Reverse Proxy to FastAPI Backend (strips /api/ prefix -> http://api:8000/)
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://learnguard_api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        # Extended timeouts for LLM brief generation, advisor chat, and evaluation gate runs
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        send_timeout 180s;
    }

    # Immutable cache headers for content-hashed Vite bundles
    # Note: Nginx drops server-level add_header directives whenever a location block defines add_header,
    # so HSTS and all 5 security headers are repeated explicitly in /assets/ and /.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        try_files $uri =404;
    }

    # React Router SPA fallback (supports deep-links like /overview, /evaluations, /audit)
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        try_files $uri $uri/ /index.html;
    }
}
