# LearnGuard Production Nginx Configuration — Frontend SPA & API Reverse Proxy
# Mounted at /etc/nginx/conf.d/default.conf in the frontend container.

# Rate-limiting zone for API requests (20 requests/sec per client IP, 10MB shared memory)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream learnguard_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 10m;

    # Gzip compression for static assets & JSON responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Hardened HTTP Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # Container and Load Balancer Liveness Probe
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 200 "ok\n";
    }

    # Reverse Proxy to FastAPI Backend (strips /api/ prefix -> http://api:8000/)
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://learnguard_api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        # Extended timeouts for LLM brief generation, advisor chat, and evaluation gate runs
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        send_timeout 180s;
    }

    # Immutable cache headers for content-hashed Vite bundles
    # Note: Nginx drops server-level add_header directives whenever a location block defines add_header,
    # so all 5 security headers are repeated explicitly in /assets/ and /.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        try_files $uri =404;
    }

    # React Router SPA fallback (supports deep-links like /overview, /evaluations, /audit)
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        try_files $uri $uri/ /index.html;
    }
}
