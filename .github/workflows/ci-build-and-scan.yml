# =============================================================================
# LearnGuard — Immutable Container Build, Trivy Vulnerability Scan & GHCR Push
# Reference: ADR-0009
#
# Builds Dockerfile.api, Dockerfile.ml, and Dockerfile.fe from pinned source
# commits, scans images with Aqua Trivy, pushes to ghcr.io, and outputs
# immutable @sha256 image digests for production deployment.
# =============================================================================
name: CI — Build, Scan & Push Images to GHCR

on:
  push:
    branches: [main]
    paths:
      - "deploy/docker/**"
      - "deploy/digitalocean/**"
      - ".github/workflows/ci-build-and-scan.yml"
  workflow_dispatch:
    inputs:
      push_images:
        description: "Push built images to GitHub Container Registry (ghcr.io)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  build-scan-push:
    name: "Build, Scan & Push (${{ matrix.component }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            image_name: learnguard-api
            dockerfile: learnguard-platform/deploy/docker/Dockerfile.api
            repo: ntk223/BE-MLOPS
            ref: a2bae92
            context_dir: BE-MLOPS
          - component: ml
            image_name: learnguard-ml
            dockerfile: learnguard-platform/deploy/docker/Dockerfile.ml
            repo: ntk223/Data-ML-MLOPS
            ref: 72c96cd
            context_dir: Data-ML-MLOPS
          - component: fe
            image_name: learnguard-fe
            dockerfile: learnguard-platform/deploy/docker/Dockerfile.fe
            repo: ntk223/FE-MLOPS
            ref: 0f70e14
            context_dir: FE-MLOPS

    steps:
      - name: Checkout learnguard-platform
        uses: actions/checkout@v4
        with:
          path: learnguard-platform

      - name: Checkout component source repository (${{ matrix.repo }}@${{ matrix.ref }})
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: ${{ matrix.context_dir }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' || inputs.push_images == true
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image for Trivy scan
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context_dir }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_name }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Push immutable image to GHCR and export @sha256 digest
        id: push_step
        if: github.event_name == 'push' || inputs.push_images == true
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context_dir }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_name }}:latest
          cache-from: type=gha

      - name: Record immutable digest in Job Summary
        if: steps.push_step.outputs.digest != ''
        run: |
          {
            echo "### Published Immutable Container Image (${{ matrix.component }})"
            echo "- **Source Ref:** \`${{ matrix.repo }}@${{ matrix.ref }}\`"
            echo "- **Image Digest Reference:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image_name }}@${{ steps.push_step.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
