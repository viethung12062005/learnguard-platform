# =============================================================================
# LearnGuard — Platform Continuous Integration & 6-Layer AI System Quality Gate
# Reference: ADR-0009 & docs/conventions/software-engineering-and-mlops-conventions.md
# =============================================================================
name: CI — Platform & 6-Layer AI Quality Gate

on:
  push:
    branches: [main, "feat/**", "fix/**", "ops/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Static Analysis, ShellCheck, Docker Compose & Release Manifest Gate
  # ---------------------------------------------------------------------------
  lint-and-validate:
    name: "L1 Guardrails: Shell, Ruff, Compose & Manifests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout learnguard-platform
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff and PyYAML
        run: pip install --no-cache-dir ruff pyyaml

      - name: Validate Bash syntax (bash -n) & ShellCheck on operational scripts
        run: |
          for script in scripts/do/*.sh scripts/cd/*.sh deploy/digitalocean/*.sh; do
            echo "Checking syntax: ${script}"
            bash -n "${script}"
          done
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x scripts/do/*.sh scripts/cd/*.sh deploy/digitalocean/*.sh
          fi

      - name: Run Ruff lint on MLOps orchestrator and platform test suite
        run: |
          ruff check deploy/ml tests

      - name: Validate Release Manifests (dev.yaml & prod.yaml)
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for name in ("dev.yaml", "prod.yaml"):
              path = Path("deploy/releases") / name
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              assert data["schema"] == "release-manifest.v2", f"{name} missing schema v2"
              assert "components" in data and "active_model_release" in data
              for comp in ("api", "ml_batch", "frontend"):
                  img = data["components"][comp]["image"]
                  assert "@sha256:" in img, f"{name} component {comp} must pin @sha256 digest"
          print("Release manifests validated successfully.")
          PY

      - name: Validate DigitalOcean Docker Compose configurations (prod & staging)
        run: |
          docker compose \
            --env-file deploy/digitalocean/.env.prod.example \
            -f deploy/digitalocean/docker-compose.prod.yml \
            config -q
          docker compose \
            --env-file deploy/digitalocean/.env.prod.example \
            -f deploy/digitalocean/docker-compose.prod.yml \
            -f deploy/digitalocean/docker-compose.staging.yml \
            config -q

      - name: Dry-run CD operational scripts
        run: |
          ./scripts/do/bootstrap-vm.sh --dry-run
          ./scripts/cd/backup-db.sh --dry-run
          ./scripts/cd/restore-db.sh --file /tmp/dummy.sql.gz --dry-run
          ./scripts/cd/smoke-test.sh --dry-run
          ./scripts/cd/rollback-do.sh --dry-run
          ./scripts/cd/deploy-do.sh --dry-run

  # ---------------------------------------------------------------------------
  # Job 2: 6-Layer AI System Tests (Contract + Behavioral + Drift & Retraining)
  # ---------------------------------------------------------------------------
  test-ml-and-drift-pipeline:
    name: "L2-L5 Gates: Contracts, Behavioral (MFT/INV/DIR) & Drift Retraining"
    runs-on: ubuntu-latest
    needs: [lint-and-validate]
    steps:
      - name: Checkout learnguard-platform
        uses: actions/checkout@v4
        with:
          path: learnguard-platform

      - name: Checkout Data-ML-MLOPS (sibling repo if available or remote)
        uses: actions/checkout@v4
        with:
          repository: ntk223/Data-ML-MLOPS
          ref: 72c96cdfde4bbf084cc68ede500aa4f0c4e3decf
          path: Data-ML-MLOPS

      - name: Checkout BE-MLOPS (sibling repo if available or remote)
        uses: actions/checkout@v4
        with:
          repository: ntk223/BE-MLOPS
          ref: a2bae92603aea5796de03267f32cc55589dfd9d0
          path: BE-MLOPS

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and sibling packages
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml numpy pandas scikit-learn scipy joblib shap threadpoolctl matplotlib httpx alembic
          if [ -f Data-ML-MLOPS/pyproject.toml ]; then
            pip install -e Data-ML-MLOPS
          fi
          if [ -f BE-MLOPS/pyproject.toml ]; then
            pip install -e BE-MLOPS
          fi

      - name: Execute Platform Contract, Behavioral, and Drift/Retraining Test Suites
        working-directory: learnguard-platform
        run: |
          pytest -v tests/
