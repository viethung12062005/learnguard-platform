name: CD · dev · frontend

# Frontend là static SPA → deploy lên Static Web App bằng deployment token.
# Không cần quyền Azure ARM, chạy được trên GitHub-hosted runner.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref của FE-MLOPS (branch hoặc SHA)"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: cd-dev-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy Static Web App
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout FE-MLOPS
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.APP_ORG }}/FE-MLOPS
          ref: ${{ inputs.ref }}
          token: ${{ secrets.APPS_READ_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build
        env:
          VITE_BACKEND_API_URL: ${{ vars.API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy lên Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_API_TOKEN }}
          action: upload
          app_location: dist
          output_location: ""
          skip_app_build: true
